services:
  ml-service:
    build: ./ml-service
    ports:
      - "8000:8000"

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      NODE_ENV: production
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      ML_SERVICE_URL: http://ml-service:8000
      FOOTBALL_DATA_PROVIDER: ${FOOTBALL_DATA_PROVIDER:-null}
      FOOTBALL_DATA_API_KEY: ${FOOTBALL_DATA_API_KEY:-}
      FOOTBALL_DATA_RAPIDAPI_KEY: ${FOOTBALL_DATA_RAPIDAPI_KEY:-}
      ALLOWED_ORIGINS: http://localhost:5173
    depends_on:
      - ml-service

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
