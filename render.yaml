# Render Blueprint for the backend API and ML service — https://render.com/docs/blueprint-spec
#
# Deploys backend/Dockerfile and ml-service/Dockerfile as two web services.
# The frontend is a separate deploy target (a static build — see
# Deployment.md and its Vercel section) so it isn't in this Blueprint.
# Fields marked `sync: false` are secrets/environment-specific values
# Render will prompt for when you create the Blueprint (or that you set
# later in the service's Environment tab) rather than values baked into
# this file — never put a real key/secret directly in this file, since
# it's committed to the repo.
#
# PORT is deliberately not set on either service: Render injects its own
# PORT into the container, and both backend/src/config/env.ts and
# ml-service/Dockerfile's CMD read it (process.env.PORT /
# ${PORT:-8000} respectively) with no hardcoded default that would
# conflict.

services:
  - type: web
    name: football-analysis-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ML_SERVICE_URL
        sync: false
      # Shared with football-analysis-ml-service's own ML_SERVICE_API_KEY
      # below — both must be set to the identical value. Without this, the
      # ml-service's public Render URL accepts prediction/training requests
      # from anyone on the internet, not just this backend (see
      # ml-service/app/security.py). Generate any random string (e.g.
      # `openssl rand -hex 32`); it's a shared secret, not a vendor key.
      - key: ML_SERVICE_API_KEY
        sync: false
      # football-data-org — a real, live-verified provider (see
      # Changelog.md's "First live verification" entry) — is the default
      # here rather than "null" or "api-football": no live api-football key
      # has ever been available in this project, while football-data-org
      # has actually been exercised against real data. Requires
      # FOOTBALL_DATA_ORG_API_KEY (below) to be set BEFORE this deploys —
      # registry.ts fails fast at boot otherwise, by design, rather than
      # silently falling back to fabricated data.
      - key: FOOTBALL_DATA_PROVIDER
        value: "football-data-org"
      - key: FOOTBALL_DATA_API_KEY
        sync: false
      # Optional backup for FOOTBALL_DATA_API_KEY — a RapidAPI key for the
      # same vendor, used only as a failover when the primary channel fails
      # (see backend/.env.example and ApiFootballProvider.ts). Leave unset
      # in the Render dashboard to run with no backup.
      - key: FOOTBALL_DATA_RAPIDAPI_KEY
        sync: false
      # Required — FOOTBALL_DATA_PROVIDER above defaults to
      # "football-data-org", a swappable alternative to api-football, not a
      # second simultaneous source (see backend/.env.example,
      # Data_Sources.md, and FootballDataOrgProvider.ts).
      - key: FOOTBALL_DATA_ORG_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX
        value: "120"
      # On by default — this Blueprint targets a single backend instance
      # (plan: free, no autoscaling configured), matching the scheduler's
      # own single-instance assumption (no cross-process locking — see
      # Data_Sources.md). Revisit before ever running more than one
      # replica.
      - key: SCHEDULER_ENABLED
        value: "true"

  # Stateless — no database, no external calls. Once deployed, copy its
  # public URL into the backend service's own ML_SERVICE_URL (Environment
  # tab) so POST /admin/predictions/run can actually reach it, and set
  # ML_SERVICE_API_KEY below to the same value as the backend's.
  - type: web
    name: football-analysis-ml-service
    runtime: docker
    dockerfilePath: ./ml-service/Dockerfile
    dockerContext: ./ml-service
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      # /health (Render's own healthCheckPath above) never checks this — see
      # security.py — so setting it can't break the health check itself.
      # Leaving it unset works too (no enforcement, matching local dev/CI)
      # but means anyone with this service's public Render URL can call its
      # prediction/training endpoints directly, for free, unlimited.
      - key: ML_SERVICE_API_KEY
        sync: false
