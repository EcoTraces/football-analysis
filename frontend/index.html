<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Football Analysis</title>
    <meta
      name="description"
      content="Football match analysis and statistical predictions: Poisson/Elo/ensemble models, expected goals, form, and risk-classified selections — signed-in access only."
    />
    <!-- The whole app requires sign-in (no public content to index) — see
         README.md's access-control section — so this deliberately asks
         crawlers not to index it rather than let a bare sign-in page rank
         for football-prediction search terms it can't actually serve to an
         anonymous visitor. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0f172a" />
    <meta property="og:title" content="Football Analysis" />
    <meta
      property="og:description"
      content="Football match analysis and statistical predictions: Poisson/Elo/ensemble models, expected goals, form, and risk-classified selections."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-white font-sans text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
